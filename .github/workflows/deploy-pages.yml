name: 部署工作台到 Pages

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['index.html']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 配置 Pages
        id: config
        uses: actions/configure-pages@v5
      - name: 上传静态网页
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
